[package]
name = "yew-e2e"
version = "0.1.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
rust-version = "1.89"
description = """
Browser tests for Yew applications, and the runner that drives them.
"""
documentation = "https://docs.rs/yew-e2e"
readme = "README.md"
homepage = "https://github.com/udoprog/yew-e2e"
repository = "https://github.com/udoprog/yew-e2e"
license = "MIT OR Apache-2.0"
keywords = ["browser", "e2e", "testing", "webdriver", "yew"]
categories = ["development-tools::testing", "wasm", "web-programming"]

[dependencies]
anyhow = "1.0.99"
# The runner's own arguments: flags with values, an alias for cargo's spelling
# of one, and the handful of libtest flags that are taken and ignored.
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# What a run of the suite is written down as, so the next one can pick up what
# did not pass; see `sessions.rs`.
musli = { version = "0.1.8", features = ["json"] }
rand = "0.10.0"
# Fetching a chromedriver matched to the Chrome that is installed; see
# `fetch.rs`. Blocking, since it happens once, before the runtime is built.
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde_json = "1.0.150"
tempfile = "3.20.0"
thirtyfour = "0.37.4"
tokio = { version = "1", features = ["full", "net"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The public TestDriver and TestElement API against pages of its own; skips
# itself on a machine with no browser to drive.
[[test]]
name = "api"
path = "tests/api/main.rs"
harness = false
